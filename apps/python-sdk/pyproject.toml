[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "land-governance-sdk"
version = "1.0.0"
description = "Official Python SDK for the National Land Governance Platform (SIH PS 26019)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Land Governance Platform Team", email = "info@landgov.gov.in" }
]
keywords = [
    "land-governance", "dolr", "sih", "sih-2026", "digital-india",
    "gis", "cadastre", "svamitva", "dilrmp", "policy-simulation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5.0"]
all = ["pandas>=1.5.0", "pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/ayushjagtap2022/Land-Governance-Platform"
Documentation = "https://github.com/ayushjagtap2022/Land-Governance-Platform/tree/main/apps/python-sdk"
Repository = "https://github.com/ayushjagtap2022/Land-Governance-Platform.git"
