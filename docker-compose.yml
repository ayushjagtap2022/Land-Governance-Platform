version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: land-governance-api
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: land-governance-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
